<style>
:root {

* { margin:0; padding:0; box-sizing:border-box; }
body {

  background: var(--bg); color: var(--text); line-height:1.7;
}
/* ===== Header ===== */
.header {

}
.header h1 { font-size:1.15em; color:var(--accent); }
.header .meta { font-size:0.82em; color:var(--text2); }
.header .progress-bar {
  width:200px; height:6px; background:var(--border); border-radius:3px; overflow:hidden; margin-top:4px;
}
.header .progress-bar .fill { height:100%; background:linear-gradient(90deg,var(--green),var(--accent)); transition:width .5s; }
.header .right { display:flex; align-items:center; gap:16px; }
.header .btn-home, .header .btn-reset {
  background: var(--card2); color: var(--accent2); border:1px solid var(--border);
  padding:5px 14px; border-radius:6px; cursor:pointer; font-size:0.85em; transition: all .2s;
}
.header .btn-home:hover, .header .btn-reset:hover { border-color:var(--accent); background:var(--card); }

/* ===== Home View ===== */
.home-view { max-width:1000px; margin:0 auto; padding:30px 24px; }
.home-view h2 { color:var(--accent); font-size:1.4em; margin-bottom:8px; }
.home-view .subtitle { color:var(--text2); margin-bottom:24px; font-size:0.9em; }
.course-overview {
  background: var(--card); border:1px solid var(--border); border-radius:12px;
  padding:20px 24px; margin-bottom:24px;
}
.course-overview h3 { color:var(--yellow); font-size:1.1em; margin-bottom:12px; }
.course-overview ul { list-style:none; padding-left:0; }
.course-overview li {
  padding:5px 0 5px 20px; position:relative; font-size:0.9em; color:var(--text);
}
.course-overview li::before {
  content:"▸"; position:absolute; left:0; color:var(--accent);
}

.module-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
.module-card {
  background: var(--card); border:1px solid var(--border); border-radius:10px;
  padding:16px 20px; cursor:pointer; transition: all .25s; position:relative;
}
.module-card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 4px 20px rgba(88,166,255,.15); }
.module-card .m-num {
  position:absolute; top:12px; right:16px; font-size:2em; font-weight:800;
  color:var(--border); opacity:.5;
}
.module-card .m-title { color:var(--accent2); font-size:1.05em; font-weight:700; margin-bottom:8px; padding-right:40px; }
.module-card .m-desc { font-size:0.82em; color:var(--text2); margin-bottom:10px; }
.module-card .m-chapters { font-size:0.8em; color:var(--text2); }
.module-card .m-chapters span { display:inline-block; margin-right:10px; }
.module-card .m-status {
  display:inline-block; padding:2px 8px; border-radius:4px; font-size:0.75em; margin-top:8px;
}
.m-status.done { background:rgba(63,185,80,.18); color:var(--green); }
.m-status.progress { background:rgba(210,153,34,.18); color:var(--yellow); }
.m-status.todo { background:rgba(139,148,158,.18); color:var(--text2); }

.start-btn {
  display:block; margin:24px auto; padding:12px 40px; font-size:1em;
  background: linear-gradient(135deg,var(--accent),var(--purple));
  color:#fff; border:none; border-radius:8px; cursor:pointer; transition: all .25s;
}
.start-btn:hover { transform:translateY(-2px); box-shadow:0 6px 24px rgba(88,166,255,.35); }

/* ===== Learn View ===== */
.learn-view { display:none; }
.learn-layout { display:flex; min-height: calc(100vh - 60px); }
.sidebar {
  width:260px; background:var(--card); border-right:1px solid var(--border);
  padding:16px 0; position:sticky; top:60px; height:calc(100vh - 60px); overflow-y:auto;
}
.sidebar h3 { color:var(--accent); font-size:0.95em; padding:0 16px 10px; border-bottom:1px solid var(--border); margin-bottom:8px;}
.sidebar .mod-group { margin-bottom:8px; }
.sidebar .mod-header {
  padding:8px 16px; font-size:0.88em; font-weight:700; color:var(--accent2);
  cursor:pointer; display:flex; align-items:center; gap:6px;
}
.sidebar .mod-header .caret { transition:transform .2s; font-size:.7em; }
.sidebar .mod-header.collapsed .caret { transform:rotate(-90deg); }
.sidebar .mod-items { overflow:hidden; }
.sidebar .mod-header.collapsed + .mod-items { display:none; }
.sidebar .chapter-item {
  display:flex; align-items:center; gap:8px; padding:6px 16px 6px 28px;
  font-size:0.84em; color:var(--text2); cursor:pointer; border-left:2px solid transparent; transition:all .15s;
}
.sidebar .chapter-item:hover { background:var(--card2); color:var(--text); }
.sidebar .chapter-item.active {
  background:var(--card2); color:var(--accent); border-left-color:var(--accent); font-weight:600;
}
.sidebar .chapter-item .check {
  width:16px; height:16px; border-radius:50%; border:1.5px solid var(--border);
  display:inline-flex; align-items:center; justify-content:center; font-size:.6em; flex-shrink:0;
}
.sidebar .chapter-item .check.done { background:var(--green); border-color:var(--green); color:#fff; }

.content-area { flex:1; padding:24px 32px; max-width:900px; margin:0 auto; }
/* Breadcrumb */
.breadcrumb { font-size:0.82em; color:var(--text2); margin-bottom:12px; }
.breadcrumb span { color:var(--accent2); }

/* Summary box */
.summary-box {
  background: linear-gradient(135deg, rgba(188,140,255,.08), rgba(88,166,255,.08));
  border:1px solid rgba(188,140,255,.3); border-radius:10px; padding:16px 20px; margin-bottom:20px;

.summary-box h4 { color:var(--purple); font-size:0.95em; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
.summary-box ul { list-style:none; padding-left:0; }
.summary-box li {
  padding:4px 0 4px 18px; position:relative; font-size:0.88em;
}
.summary-box li::before { content:"★"; position:absolute; left:0; color:var(--yellow); font-size:.85em; }

/* Markdown content */
.md-content { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:24px 28px; }
.md-content h1 { color:var(--accent); font-size:1.4em; margin:16px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--border); }
.md-content h2 { color:var(--accent2); font-size:1.2em; margin:20px 0 10px; }
.md-content h3 { color:var(--text); font-size:1.05em; margin:16px 0 8px; }
.md-content p { margin:8px 0; font-size:0.9em; }
.md-content ul, .md-content ol { padding-left:24px; margin:8px 0; font-size:0.9em; }
.md-content li { margin:4px 0; }
.md-content code {
  background:#0d1117; border:1px solid var(--border); padding:1px 6px; border-radius:4px;
  font-size:0.86em; color:var(--accent2);
}
.md-content pre {
  background:#0d1117; border:1px solid var(--border); border-radius:8px; padding:14px; overflow-x:auto; margin:10px 0;
}
.md-content pre code { background:none; border:none; padding:0; }
.md-content table { border-collapse:collapse; width:100%; margin:10px 0; font-size:0.85em; }
.md-content th, .md-content td { border:1px solid var(--border); padding:6px 10px; text-align:left; }
.md-content th { background:var(--card2); color:var(--accent2); }
.md-content img { max-width:100%; border-radius:8px; margin:8px 0; }
.md-content blockquote {
  border-left:3px solid var(--accent); padding:8px 16px; margin:10px 0;
  background:var(--card2); border-radius:0 6px 6px 0; color:var(--text2);
}

/* Nav buttons */
.nav-buttons {
  display:flex; justify-content:space-between; margin-top:24px; padding:16px 0; border-top:1px solid var(--border);
}
.nav-buttons button {
  padding:8px 24px; border-radius:8px; font-size:0.9em; cursor:pointer; transition:all .2s; border:1px solid var(--border);
  background:var(--card2); color:var(--text);
}
.nav-buttons button:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); }
.nav-buttons button:disabled { opacity:.4; cursor:not-allowed; }
.nav-buttons .btn-mark-done {
  background: linear-gradient(135deg,var(--green),#2ea043); color:#fff; border:none;
}
.nav-buttons .btn-mark-done:hover { opacity:.9; }

/* Toast */
.toast {
  position:fixed; top:70px; right:24px; z-index:200;
  background:var(--card); border:1px solid var(--green); border-radius:8px;
  padding:10px 20px; color:var(--green); font-size:0.88em;
  transform:translateX(400px); transition:transform .3s;
}
.toast.show { transform:translateX(0); }

/* Loading */
.loading { text-align:center; padding:40px; color:var(--text2); }
.loading .spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 12px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Responsive */
@media (max-width: 768px) {
  .module-grid { grid-template-columns: 1fr; }
  .sidebar { display:none; }
  .content-area { padding:16px; }
}
</style>
</head>

// ===== 进度管理 =====
const PROG_KEY = "jz_course_progress_v1";
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(PROG_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveProgress(p) { localStorage.setItem(PROG_KEY, JSON.stringify(p)); }
function getDoneSet() {
  const p = loadProgress();
  return new Set(p.done || []);
}
function toggleDone(key) {
  const p = loadProgress();
  p.done = p.done || [];
  const idx = p.done.indexOf(key);
  if (idx > -1) p.done.splice(idx, 1); else p.done.push(key);
  p.current = key;
  saveProgress(p);
}
function getCurrent() {
  const p = loadProgress();
  return p.current || null;
}
function setCurrent(key) {
  const p = loadProgress();
  p.current = key;
  saveProgress(p);
}

// 获取所有可学章节（有md文件的）
function getLearnableChapters() {
  const list = [];
  MODULES.forEach(m => {
    m.chapters.forEach((ch, ci) => {
      if (ch.file) list.push({ modId:m.id, modName:m.name, chName:ch.name, chIndex:ci, file:ch.file, key:`${m.id}-${ci}` });
    });
  });
  return list;
}

// ===== 渲染首页 =====
function renderHome() {
  document.getElementById('homeView').style.display = 'block';
  document.getElementById('learnView').style.display = 'none';

  // 总览
  const ovList = document.getElementById('overviewList');
  ovList.innerHTML = OVERVIEW.map(s => `<li>${s}</li>`).join('');

  // 模块卡片
  const done = getDoneSet();
  const grid = document.getElementById('moduleGrid');
  grid.innerHTML = MODULES.map(m => {
    const total = m.chapters.filter(c => c.file).length;
    const doneCount = m.chapters.filter((c, ci) => c.file && done.has(`${m.id}-${ci}`)).length;
    const status = doneCount === 0 ? 'todo' : doneCount === total ? 'done' : 'progress';
    const statusText = doneCount === 0 ? '未开始' : doneCount === total ? '已完成' : `学习中 ${doneCount}/${total}`;
    return `
      <div class="module-card" onclick="jumpToModule(${m.id})">
        <div class="m-num">${m.id}</div>
        <div class="m-title">${m.name}</div>
        <div class="m-desc">${m.desc}</div>
        <div class="m-chapters">${m.chapters.map(c => `<span>📄${c.name}</span>`).join('')}</div>
        <div class="m-status ${status}">${statusText}</div>
      </div>`;
  }).join('');

  // 进度条
  const all = getLearnableChapters();
  const doneAll = all.filter(c => done.has(c.key)).length;
  document.getElementById('progFill').style.width = (all.length ? doneAll/all.length*100 : 0) + '%';
}

function jumpToModule(modId) {
  const all = getLearnableChapters();
  const first = all.find(c => c.modId === modId && !getDoneSet().has(c.key));
  const target = first || all.find(c => c.modId === modId);
  if (target) loadChapter(target.modId, target.chIndex);
}

// ===== 渲染侧边栏 =====
function renderSidebar() {
  const done = getDoneSet();
  const current = getCurrent();
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '<h3>📖 课程目录</h3>' + MODULES.map(m => {
    const items = m.chapters.map((ch, ci) => {
      const key = `${m.id}-${ci}`;
      const isDone = done.has(key);
      const isActive = current === key;
      const clickable = ch.file;
      return `<div class="chapter-item ${isActive?'active':''}" ${clickable?`onclick="loadChapter(${m.id},${ci})"`:'style="opacity:.5"'}>
        <span class="check ${isDone?'done':''}">${isDone?'✓':''}</span>
        ${ch.name}${ch.isPdf?' 📕':''}
      </div>`;
    }).join('');
    return `
      <div class="mod-group">
        <div class="mod-header" onclick="this.classList.toggle('collapsed')">
          <span class="caret">▼</span>模块${m.id} ${m.name}
        </div>
        <div class="mod-items">${items}</div>
      </div>`;
  }).join('');
}

// ===== 加载章节 =====
async function loadChapter(modId, chIndex) {
  const mod = MODULES.find(m => m.id === modId);
  const ch = mod.chapters[chIndex];
  if (!ch.file) { showToast('该章节为PDF简报，暂不支持在线预览'); return; }

  setCurrent(`${modId}-${chIndex}`);
  renderSidebar();

  // 面包屑
  document.getElementById('breadcrumb').innerHTML = `模块${modId} <span>${mod.name}</span> / <span>${ch.name}</span>`;

  // 要点
  const summaryKey = `${modId}-${ch.name}`;
  const summary = SUMMARIES[summaryKey];
  const sBox = document.getElementById('summaryBox');
  if (summary) {
    document.getElementById('summaryList').innerHTML = summary.map(s => `<li>${s}</li>`).join('');
    sBox.style.display = 'block';
  } else {
    sBox.style.display = 'none';
  }

  // 加载md
  const mdEl = document.getElementById('mdContent');
  mdEl.innerHTML = '<div class="loading"><div class="spinner"></div>加载中...</div>';

  document.getElementById('homeView').style.display = 'none';
  document.getElementById('learnView').style.display = 'block';

  try {
    const resp = await fetch(ch.file);
    const text = await resp.text();
    // 去掉BOM
    const clean = text.replace(/^\uFEFF/, '');
    mdEl.innerHTML = marked.parse(clean);
    // 滚动到顶部
    document.querySelector('.content-area').scrollTo(0, 0);
    window.scrollTo(0, 0);
  } catch(e) {
    mdEl.innerHTML = `<p style="color:var(--red)">加载失败：${e.message}<br>文件路径：${ch.file}</p>`;
  }

  updateNavButtons(modId, chIndex);
}

function updateNavButtons(modId, chIndex) {
  const all = getLearnableChapters();
  const curIdx = all.findIndex(c => c.modId === modId && c.chIndex === chIndex);
  document.getElementById('btnPrev').disabled = curIdx <= 0;
  document.getElementById('btnNext').disabled = curIdx >= all.length - 1;
}

// ===== 导航按钮 =====
document.getElementById('btnHome').onclick = () => { renderHome(); renderSidebar(); };
document.getElementById('btnStart').onclick = () => {
  const current = getCurrent();
  if (current) {
    const [modId, chIdx] = current.split('-');
    loadChapter(parseInt(modId), parseInt(chIdx));
  } else {
    loadChapter(1, 0);
  }
};
document.getElementById('btnPrev').onclick = () => {
  const cur = getCurrent();
  if (!cur) return;
  const [modId, chIdx] = cur.split('-').map(Number);
  const all = getLearnableChapters();
  const idx = all.findIndex(c => c.modId === modId && c.chIndex === chIdx);
  if (idx > 0) loadChapter(all[idx-1].modId, all[idx-1].chIndex);
};
document.getElementById('btnNext').onclick = () => {
  const cur = getCurrent();
  if (!cur) return;
  const [modId, chIdx] = cur.split('-').map(Number);
  const all = getLearnableChapters();
  const idx = all.findIndex(c => c.modId === modId && c.chIndex === chIdx);
  if (idx < all.length - 1) loadChapter(all[idx+1].modId, all[idx+1].chIndex);
};
document.getElementById('btnDone').onclick = () => {
  const cur = getCurrent();
  if (!cur) return;
  const [modId, chIdx] = cur.split('-').map(Number);
  const key = `${modId}-${chIdx}`;
  toggleDone(key);
  showToast('✓ 已标记完成！');
  renderSidebar();
  renderHome();
  // 自动跳下一节
  const all = getLearnableChapters();
  const idx = all.findIndex(c => c.modId === modId && c.chIndex === chIdx);
  if (idx < all.length - 1) loadChapter(all[idx+1].modId, all[idx+1].chIndex);
  else { showToast('🎉 全部章节已学完！'); }
};
document.getElementById('btnReset').onclick = () => {
  if (confirm('确定要重置所有学习进度吗？此操作不可撤销。')) {
    localStorage.removeItem(PROG_KEY);
    renderHome();
    renderSidebar();
    showToast('进度已重置');
  }
};

// ===== Toast =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== 初始化 =====
renderHome();
renderSidebar();
</script>
